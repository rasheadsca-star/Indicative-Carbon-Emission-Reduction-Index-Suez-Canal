name: AIS Lab Quality Gate
on:
  push:
    branches: [main, feat/ais-lab-openwaters-20261114]
    paths:
      - 'ais-lab/**'
      - '.github/workflows/ais-lab.yml'
  pull_request:
    paths:
      - 'ais-lab/**'
      - '.github/workflows/ais-lab.yml'
permissions:
  contents: read
jobs:
  test-ais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check ais-lab/core.mjs
          node --check ais-lab/app.mjs
      - name: Test AIS transit engine
        run: node --test ais-lab/core.test.mjs
      - name: Verify separated UI route
        run: test -f ais-lab/index.html && test -f index.html && test -f worker.js
