name: AIS Source Quality — hourly metadata
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ais-source-quality.mjs'
      - 'src/ais-quality-history.mjs'
      - 'src/ais-quality-history.test.mjs'
      - '.github/workflows/ais-source-quality.yml'
permissions:
  contents: write
concurrency:
  group: ais-source-quality
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check diagnostic syntax
        run: node --check scripts/ais-source-quality.mjs && node --test src/ais-quality-history.test.mjs
      - name: Collect publicly accessible source health
        run: node scripts/ais-source-quality.mjs
      - name: Store metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-source-quality
          path: |
            data/ais-source-health.json
            data/ais-quality-history.json
            data/ais-quality-summary.json
          retention-days: 30
      - name: Commit public aggregate-only health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ais-source-health.json data/ais-quality-history.json data/ais-quality-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update AIS source quality (not official traffic)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  publish-status:
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full test gate before publishing (DEF-002)
        run: npm ci && npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
