name: Green Route V4 + IMO Integrated
on:
  pull_request:
    paths:
      - 'sca-green-route-v4-imo-integrated.html'
      - 'tests/green-route-v4-imo-integrated.test.mjs'
      - 'index.html'
      - '.github/workflows/green-route-v4-imo.yml'
  push:
    branches: [main]
    paths:
      - 'sca-green-route-v4-imo-integrated.html'
      - 'tests/green-route-v4-imo-integrated.test.mjs'
      - '.github/workflows/green-route-v4-imo.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/green-route-v4-imo-integrated.test.mjs
