name: SCA Historical Performance - official 1975-2025 QA
on:
  pull_request:
    paths:
      - 'historical-performance.html'
      - 'data/sca-official-annual-history-1975-2025.json'
      - 'data/sca-official-monthly-2024-2025.json'
      - 'src/historical-performance.mjs'
      - 'src/historical-performance.test.mjs'
      - 'tests/historical-performance-page.test.mjs'
      - '.github/workflows/historical-performance.yml'
  push:
    branches: [main]
    paths:
      - 'historical-performance.html'
      - 'data/sca-official-annual-history-1975-2025.json'
      - 'src/historical-performance.mjs'
      - 'src/historical-performance.test.mjs'
      - 'tests/historical-performance-page.test.mjs'
permissions:
  contents: read
jobs:
  historical-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test src/historical-performance.test.mjs tests/historical-performance-page.test.mjs
