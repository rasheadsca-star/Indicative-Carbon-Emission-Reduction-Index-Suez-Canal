name: IMO SCA Historical CO2 Engineering Gates
on:
  pull_request:
    paths:
      - 'imo-historical.html'
      - 'src/imo-historical-activity.mjs'
      - 'src/imo-historical-activity.test.mjs'
      - 'data/imo-fleet-2012-reference-coefficients.json'
      - 'data/sca-official-ship-types-2023-2025.json'
      - 'tests/imo-historical-page.test.mjs'
      - 'docs/IMO_HISTORICAL_METHODOLOGY.md'
      - '.github/workflows/imo-historical.yml'
  push:
    branches: [main]
    paths:
      - 'imo-historical.html'
      - 'src/imo-historical-activity.mjs'
      - 'src/imo-historical-activity.test.mjs'
      - 'data/imo-fleet-2012-reference-coefficients.json'
      - 'data/sca-official-ship-types-2023-2025.json'
      - 'tests/imo-historical-page.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test src/imo-historical-activity.test.mjs tests/imo-historical-page.test.mjs
