name: Voyage Physical Integrity
on:
  pull_request:
    paths:
      - 'src/voyage-physical.mjs'
      - 'src/voyage-sensitivity.mjs'
      - 'src/sca-tolls-2024.mjs'
      - 'src/fuel-lca-scenario.mjs'
      - 'src/regulation-screen.mjs'
      - 'tests/voyage-physical.test.mjs'
      - 'tests/voyage-sensitivity.test.mjs'
      - 'tests/tolls-lca.test.mjs'
      - 'tests/next-ui-integration.test.mjs'
      - 'tests/regulation-screen.test.mjs'
      - 'next/index.html'
      - 'next/offline.html'
      - 'tests/offline-bundle.test.mjs'
      - '.github/workflows/voyage-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/voyage-physical.mjs
      - run: node --test tests/voyage-physical.test.mjs tests/tolls-lca.test.mjs tests/next-ui-integration.test.mjs tests/regulation-screen.test.mjs tests/voyage-sensitivity.test.mjs tests/offline-bundle.test.mjs
      - run: npm test
