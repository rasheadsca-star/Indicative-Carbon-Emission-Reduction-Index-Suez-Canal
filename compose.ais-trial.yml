# Private pilot only. No public AIS coordinates, MMSIs or server ports.
# Before starting: secure .secrets/aisstream_api_key.txt and set AIS_TERMS_ACCEPTED=yes
# after institutional/legal review. Requires an always-on Docker-capable host.
services:
  ceri-ais-trial:
    build:
      context: .
      dockerfile: backend/ais-trial.Dockerfile
    restart: on-failure
    init: true
    user: "node"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      AIS_PRIVATE_DATA_DIR: /var/lib/ceri-ais
      AISSTREAM_API_KEY_FILE: /run/secrets/aisstream_key
      AIS_TERMS_ACCEPTED: ${AIS_TERMS_ACCEPTED:-no}
      NODE_ENV: production
    secrets:
      - aisstream_key
    volumes:
      - ceri-private-ais:/var/lib/ceri-ais
    tmpfs:
      - /tmp:size=16m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    stop_grace_period: 40s

secrets:
  aisstream_key:
    file: ./.secrets/aisstream_api_key.txt
volumes:
  ceri-private-ais:
